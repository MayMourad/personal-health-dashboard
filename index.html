<title>Health Dashboard</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--ln:#e6e5e0;--ac:#2f6f6a;--ac2:#c2693a;--ac3:#5b6fb0;--wr:#b4452f}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1d;--tx:#ecebe6;--mu:#9a9992;--ln:#33332f;--ac:#5fb0a8;--ac2:#e08c5c;--ac3:#8c9fe0;--wr:#e0735c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);font-size:13px;margin-bottom:18px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav button,.seg button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
nav button.on,.seg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px}
.k b{display:block;font-size:22px;font-weight:600}.k span{font-size:12px;color:var(--mu)}.k i{font-style:normal;font-size:11px;color:var(--mu);display:block;margin-top:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 2px}.card p{margin:2px 0 10px;color:var(--mu);font-size:13px}
.seg{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
svg{width:100%;height:auto;display:block;overflow:visible}svg text{fill:var(--mu);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;display:none;z-index:9;white-space:nowrap}
.flag{border-left:3px solid var(--wr);padding:8px 12px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;font-size:14px}
.flag b{display:block}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:500;font-size:12px}
.sec{display:none}.sec.on{display:block}.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.note{font-size:12px;color:var(--mu);margin-top:8px}
</style></head><body><div class="w">

$('#fl').innerHTML=`<div class="card"><h2>Flags worth acting on</h2>

<div class="flag"><b>SpO2</b>43% of in-sleep readings were below 94% and 27% below 90%. Check band fit first; if it persists, raise it with a clinician, especially with snoring or daytime sleepiness.</div>

<div class="flag"><b>HRV down, resting HR up</b>Last 28 days HRV 62.7 ms versus 88.3 ms before; resting HR 81.6 → 84.3 bpm. Worth watching; device calibration and noise can explain part of it.</div></div>
