<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Health Intelligence Dashboard</title>
<style>:root{--bg:#f5f5f1;--card:#fff;--tx:#1b1c1a;--mu:#64645e;--ln:#e6e5df;--ac:#2f6f6a;--ac2:#c2693a;--ac3:#5b6fb0;--wr:#b4452f;--sh:0 1px 2px rgba(20,20,10,.04),0 6px 18px rgba(20,20,10,.05);--c-ob:#3b6ea8;--c-as:#7a5ca8;--c-pl:#a36a0f;--c-un:#b4452f;--c-rc:#2f6f6a}
@media(prefers-color-scheme:dark){:root{--bg:#121312;--card:#1c1d1b;--tx:#ecebe6;--mu:#a3a29b;--ln:#2e2f2b;--ac:#5fb0a8;--ac2:#e08c5c;--ac3:#8c9fe0;--wr:#e0735c;--sh:0 1px 2px rgba(0,0,0,.35);--c-ob:#7fb0e8;--c-as:#b49be0;--c-pl:#e0b25c;--c-un:#e0735c;--c-rc:#5fb0a8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 64px}
.hero{background:linear-gradient(135deg,#2a6862 0%,#1f4c66 100%);color:#fff;border-radius:18px;padding:22px 22px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.hero h1{font-size:25px;letter-spacing:-.015em;margin:0 0 4px;font-weight:650}.hero .sub{color:rgba(255,255,255,.85);font-size:13px;margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:inherit;font-size:12px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28)}
button.chip.alert{background:#fff;color:#8f2f1e;border-color:#fff;cursor:pointer;font-weight:600}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:8px 0;z-index:5}
nav button,.seg button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:6px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
nav button:hover,.seg button:hover{border-color:var(--mu)}
nav button.on,.seg button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--ln);border-top:3px solid var(--ac);border-radius:12px;padding:12px 14px;box-shadow:var(--sh)}
.k b{display:block;font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.k span{font-size:12px;color:var(--mu)}.k i{font-style:normal;font-size:11px;color:var(--mu);display:block;margin-top:2px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:16px;margin:0 0 3px;font-weight:650;letter-spacing:-.005em}.card p{margin:2px 0 10px;color:var(--mu);font-size:13px}
.pc{border-left:4px solid var(--ac)}.pc p{color:var(--tx);font-size:14px}.pc p.note{color:var(--mu);font-size:12px}
.seg{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
svg{width:100%;height:auto;display:block;overflow:visible}svg text{fill:var(--mu);font-size:11px}
.tip{position:fixed;pointer-events:none;background:var(--tx);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12px;display:none;z-index:9;white-space:nowrap;box-shadow:var(--sh)}
.flag{--tc:var(--wr);border-left:3px solid var(--tc);padding:9px 13px;margin:9px 0;background:var(--bg);border-radius:0 10px 10px 0;font-size:14px}
.flag b{display:block;margin-bottom:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:500;font-size:12px}tr:last-child td{border-bottom:0}
.sec{display:none}.sec.on{display:block}
.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px;flex-wrap:wrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.tg{--tc:var(--mu);display:inline-block;font-size:11px;font-weight:600;border:1px solid color-mix(in srgb,var(--tc) 40%,transparent);background:color-mix(in srgb,var(--tc) 11%,transparent);border-radius:999px;padding:0 9px;margin-right:6px;color:var(--tc);vertical-align:1px;letter-spacing:.01em}
code{font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
select,input{font:inherit;font-size:13px;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:3px 4px}
.note{font-size:12px;color:var(--mu);margin-top:8px}a{color:var(--ac3)}
@media(max-width:560px){.hero{padding:18px 16px 14px}.hero h1{font-size:21px}.card{padding:14px}.k b{font-size:21px}}
</style></head><body><div class="w">

$('#pr').innerHTML=`<div class="card"><h2>Personalized improvement priorities</h2><p>Ranked from the sleep data (59 nights, 8 Sep to 6 Nov). Wellness suggestions based on wearable estimates, not medical advice or a diagnosis.</p></div>
<div class="card pc"><h2>1. Increase school-night sleep opportunity <span class="tg">Recommendation</span></h2>
<p><b>Observed:</b> nights before Mon–Fri mornings average 6h34 asleep in about 6h52 in bed. 13 of 43 were under 6 h and 4 reached 8 h. Excluding the late-wake week of 12–16 Oct (probably a break; not confirmed), the average is 6h13 over 38 nights. The usual range for ages 13–18 is 8–10 h per 24 h.</p>
<p><b>Suggested step:</b> move bedtime earlier gradually, about 15–20 minutes every few days, for example 23:50 → 23:30 → 23:10 → 22:50 → 22:30 while keeping the usual wake time near 06:40. Stop at any step that feels sustainable; an extra 30–60 minutes is already worthwhile. This is a target, not a rule.</p>
<p class="note">Short school-night sleep is a plausible contributor to tiredness, but this data cannot prove it.</p></div>
<div class="card pc"><h2>2. Improve circadian consistency <span class="tg">Plausible contributor</span></h2>
<p><b>Observed:</b> weekend wake time averages about 09:10 versus 06:42 on school mornings, so the middle of sleep shifts about 1.4 h later at weekends. On regular school weeks the wake time varies by only about 23 minutes (standard deviation). All 7 daytime sleep sessions were on Fridays (88–306 min, average about 3.6 h).</p>
<p><b>Suggested step:</b> keep weekend wake times within about 60–90 minutes of school-day wake times, and get extra sleep by going to bed earlier rather than sleeping much later. Keep any daytime nap short and early. Irregular timing may contribute to feeling unrefreshed; it is not a proven cause.</p></div>
<div class="card pc"><h2>3. Improve pre-sleep recovery <span class="tg">Recommendation</span></h2>
<p>Try a 30–60 minute wind-down before the target bedtime:</p>
<table><tr><td>Study load</td><td>Set a cut-off for new academic work, and write tomorrow's to-do list so open tasks are off your mind.</td></tr>
<tr><td>Light and screens</td><td>Dim lights and avoid bright or stimulating screens in the last 30–60 minutes. Get daylight soon after waking.</td></tr>
<tr><td>Relaxation</td><td>Slow breathing, stretching, quiet music or paper reading.</td></tr>
<tr><td>Caffeine</td><td>If you have caffeinated drinks, keep them to the morning or early afternoon. No caffeine use is assumed here.</td></tr></table></div>
<div class="card pc"><h2>4. Check persistent unrefreshing sleep <span class="tg">Clinical follow-up</span></h2>
<p>If waking up unrefreshed or other recurring morning symptoms last around two months or longer, a routine check with a doctor is reasonable, whether or not there is snoring or daytime sleepiness. Ordinary causes such as short sleep, irregular timing and stress are common, and a clinician can look at others. This dashboard cannot diagnose any condition.</p>

$('#nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));document.querySelectorAll('.sec').forEach(s=>s.classList.toggle('on',s.id==t));$('#rng').style.display=(t=='fl'||t=='pr')?'none':'flex'};
$('#rng').onclick=e=>{const r=e.target.dataset.r;if(!r)return;R=+r;document.querySelectorAll('#rng button').forEach(b=>b.classList.toggle('on',b.dataset.r==r));render()};
render();
</script></body></html>
